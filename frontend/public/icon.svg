<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Metaliczny gradient gryfu -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="45%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>

    <!-- Cylindryczne cieniowanie talerzy (góra -> środek -> dół) -->
    <linearGradient id="plate25" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="20%" stop-color="#b91c1c" />
      <stop offset="80%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="plate20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="20%" stop-color="#1d4ed8" />
      <stop offset="80%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="plate15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="20%" stop-color="#ca8a04" />
      <stop offset="80%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
    <linearGradient id="plate10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="20%" stop-color="#15803d" />
      <stop offset="80%" stop-color="#166534" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="plate5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#d1d5db" />
      <stop offset="80%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
  </defs>

  <!-- Ciemne tło -->
  <rect width="512" height="512" rx="110" fill="#09090b" />
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Napis POWER z subtelnym cieniem -->
  <text x="258" y="164" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" fill="#7f1d1d" text-anchor="middle" letter-spacing="4">POWER</text>
  <text x="256" y="162" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" fill="#f9fafb" text-anchor="middle" letter-spacing="4">POWER</text>

  <!-- Gryf stalowy -->
  <rect x="160" y="250" width="192" height="12" fill="url(#steel)" />
  <!-- Radełkowanie -->
  <rect x="174" y="250" width="58" height="12" fill="#6b7280" fill-opacity="0.45" />
  <rect x="280" y="250" width="58" height="12" fill="#6b7280" fill-opacity="0.45" />
  <rect x="253" y="250" width="6" height="12" fill="#dc2626" />

  <!-- Tuleje olimpijskie -->
  <rect x="34" y="245" width="126" height="22" rx="2" fill="url(#steel)" />
  <rect x="352" y="245" width="126" height="22" rx="2" fill="url(#steel)" />

  <!-- Kołnierze oporowe -->
  <rect x="152" y="232" width="10" height="48" rx="1" fill="url(#steel)" />
  <rect x="350" y="232" width="10" height="48" rx="1" fill="url(#steel)" />

  <!-- LEWY ZESTAW IPF (cieniowane 3D, malejąca szerokość) -->
  <rect x="127" y="178" width="22" height="156" rx="2" fill="url(#plate25)" />
  <rect x="106" y="178" width="18" height="156" rx="2" fill="url(#plate20)" />
  <rect x="88" y="188" width="15" height="136" rx="2" fill="url(#plate15)" />
  <rect x="73" y="199" width="12" height="114" rx="2" fill="url(#plate10)" />
  <rect x="62" y="211" width="8" height="90" rx="1.5" fill="url(#plate5)" />

  <!-- PRAWY ZESTAW IPF (cieniowane 3D, malejąca szerokość) -->
  <rect x="363" y="178" width="22" height="156" rx="2" fill="url(#plate25)" />
  <rect x="388" y="178" width="18" height="156" rx="2" fill="url(#plate20)" />
  <rect x="409" y="188" width="15" height="136" rx="2" fill="url(#plate15)" />
  <rect x="427" y="199" width="12" height="114" rx="2" fill="url(#plate10)" />
  <rect x="442" y="211" width="8" height="90" rx="1.5" fill="url(#plate5)" />

  <!-- Napis TRUE -->
  <text x="258" y="422" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" fill="#18181b" text-anchor="middle" letter-spacing="9">TRUE</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" fill="#dc2626" text-anchor="middle" letter-spacing="9">TRUE</text>
</svg>
